name: CI

# Parallel pass/fail gates for every PR (and a backstop on direct
# pushes to main). Conventions — Node version, action versions, install
# command, timeout — match `publish.yml` so the two workflows can be
# maintained in lockstep.
#
# Each job gets its own status check so branch-protection rules can
# require them individually (`test`, `typecheck`, `build`) and a failure
# in one doesn't mask the others.
#
# WHY EVERY INSTALL IS `--ignore-scripts`
# ---------------------------------------
# package.json's `prepare` runs `npm run build`, and npm fires `prepare` on
# every root `npm ci`. That is a ~33s full client+server build (10.7s of it
# vite-plugin-dts alone) bolted onto the front of EVERY job here — four of
# which never read `dist/` at all. Measured on run 30478430052: the lint job
# took 55s, 33s of it building; Biome's actual work is 206ms.
#
# `prepare` cannot simply drop the build — it is what produces `dist` for
# consumers that pin SUI as a git dependency (`github:primestageprime/...`),
# which is the only lifecycle hook npm runs in that path. So the fix is at
# the call site: skip lifecycle scripts on install, and let the one job that
# genuinely needs `dist` build it explicitly.
#
# Verified in a clean clone with no `dist/` present: 2686 tests, `lint:ci`,
# `tsc --noEmit`, `typecheck:dev` and `health` all pass. `esbuild` does
# declare a postinstall (see package-lock.json `hasInstallScript`), but it
# resolves its binary from the per-platform optional dep at runtime, so
# skipping it is inert.
#
# WHY EVERY INSTALL CACHES NPM
# ----------------------------
# `cache: "npm"` tells actions/setup-node to save and restore npm's download
# cache, keyed on package-lock.json at the repo root. Without it, every job
# here downloaded the full dependency tree from the registry on every run, and
# the install was the job.
#
# That cost a release. On commit cd70770 the lint job ran 5m8s, hit its
# `timeout-minutes: 5` cap and was cancelled. Biome's real work in that job is
# 289ms over 1085 files — the remaining five minutes were `npm ci`. The re-run
# of the same commit passed at 4m26s, 34 seconds under the cap. `publish.yml`
# gates on a successful CI run, so the cancelled job skipped the publish:
# version 0.163.0 never reached the registry, from code that was green.
#
# The lint timeout also goes from 5 to 10 minutes, to match `test`, `typecheck`
# and `build`. The cache should make that raise moot. But a gate whose real
# work takes 0.3s must never kill a good commit because the network was slow.
#
# Keep this in step with `publish.yml`, which caches on the same terms.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Coverage rides along with the suite it already runs (~+20s on a 2-core
      # runner) so `componentsNeverExecuted` can be MEASURED. It cannot live in
      # the `health` job: that one is a fast static pass and must not spawn the
      # suite. See scripts/execution-coverage.mjs.
      - run: npm run test:coverage
      - run: npm run execution-coverage

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Biome over `src/`, at zero errors AND zero warnings as of this job's
      # introduction — `--error-on-warnings` (via `lint:ci`) is what keeps it
      # there, the same ratchet spirit as scripts/health.mjs. Plain `npm run
      # lint` stays warning-tolerant for local iteration.
      #
      # The a11y rules are the load-bearing ones: this is a component library,
      # so a keyboard trap or a bogus ARIA attribute ships to every consumer.
      # Deliberate exceptions carry an inline `biome-ignore` with a rationale;
      # blanket per-directory relaxations live in `biome.json` overrides.
      #
      # KNOWN BLIND SPOT: Biome's a11y rules only analyze intrinsic (lowercase)
      # JSX elements. SUI composes most markup from Layout variants — <Grid>,
      # <ClusterRow>, <NarrowStack> — which are custom components and therefore
      # invisible to these rules. A green check here is NOT a11y coverage.
      - run: npm run lint:ci

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # `tsconfig.json` has `noEmit: true`, so this is a pure type-check
      # pass. Vite's build only transpiles — it doesn't type-check — so
      # this job is genuinely separate signal from the build job.
      - run: npx tsc --noEmit
      # Gallery/bench check: the Overrides/DataProps split makes visual
      # config (gap/size/variant/…) a compile error at curried call sites,
      # but only if dev/ is compiled. This keeps benches honest.
      - run: npm run typecheck:dev

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      # Vision-adherence ratchet: mechanical counts (bare hex colors,
      # inline styles, missing tests/docs/depth headers) may only go
      # down. Baseline lives in scripts/health-baseline.json; a
      # deliberate increase requires committing an updated baseline.
      # npm ci required since the dotChains ratchet: style-rubric.mjs
      # imports the typescript compiler API.
      - run: npm ci --ignore-scripts
      - run: npm run health

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Builds both `build:client` and `build:server` per package.json.
      # Catches errors that compile cleanly but fail to bundle (circular
      # module-level imports, unresolved aliases, etc.).
      #
      # With `--ignore-scripts` above, this job builds once instead of twice —
      # previously `prepare` built during `npm ci` and this step built again.
      # The `bundle-budget` job below builds too, but deliberately: see there.
      - run: npm run build

  # Does the built package actually stay tree-shakeable for a CONSUMER?
  #
  # Distinct signal from `build` (which only asks whether the bundle is
  # PRODUCIBLE) and from `test` (whose scripts/build-config.test.ts asserts the
  # ADR 0005 settings are still written down). Neither can catch SUI's own
  # source growing a new eager import that drags katex into every consumer with
  # both settings still perfectly in place. This job builds six real consumer
  # apps against the real dist/ and checks what came out.
  #
  # WHY THIS BUILDS AGAIN INSTEAD OF REUSING THE `build` JOB
  # -------------------------------------------------------
  # Reusing it would mean uploading/downloading dist/ as an artifact — ~1,300
  # files, and the upload alone costs more than the ~33s rebuild. Its own job
  # also means its own status check, matching this file's convention that a
  # failure in one gate doesn't mask another, and the jobs run in parallel so
  # wall-clock is unaffected. `npm run bundle-budget` does the build itself
  # (hence no separate build step here, and no --skip-build).
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Two checks, and only one of them is a ratchet:
      #   • contamination (katex / d3-dag / kobalte in a bundle that never uses
      #     them) — hard failure, never baselined
      #   • size — ratcheted in whole KB via scripts/bundle-budget-baseline.json
      # A deliberate size increase needs
      #   npm run bundle-budget -- --update-baseline=<metric> --reason="…"
      # committed alongside the change. See AGENT_GUIDE.md.
      - run: npm run bundle-budget
