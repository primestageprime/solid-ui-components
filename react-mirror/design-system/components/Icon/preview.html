<!-- @dsCard group="Icons" height=150 subtitle="SUI's icon set" -->
<div id="root" style="padding: 16px"></div>
<script>
const h = React.createElement;
const S = window.Sui;
const k = (n) => `$${Math.round(n / 1000)}K`;
const range = [40000, 90000];
const domain = [0, 200000];
const names = ["check", "warning", "info", "plus", "minus", "close", "search", "refresh", "undo", "link", "lock", "edit", "trash", "settings", "chart-bar", "chart-line", "clock", "user", "chevron-right", "download"];
const view = h(S.WrapRow, null, names.map((name) => h(S.Icon, { key: name, name, size: "md", title: name })));
ReactDOM.createRoot(document.getElementById("root")).render(view);
</script>
